<rect width="1100" height="400" rx="18" fill="#F4F6FC"/>
<rect x="0" y="0" width="1100" height="6" rx="3" fill="url(#g)"/><text x="32" y="46" font-size="22" font-weight="600" fill="#1E1B4B">@kiorex/contracts</text><text x="32" y="68" font-size="13" fill="#475569">The one place every cross-product shape lives. Producers and consumers pin the same exact version.</text><rect x="40" y="110" width="240" height="70" rx="10" fill="#fff" stroke="#3730A3" stroke-width="1.6"/>
