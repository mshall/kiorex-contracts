<text x="940" y="232" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Kiorex web / ops / mobile</text><text x="940" y="250" text-anchor="middle" font-size="11" fill="#475569">typed clients from OpenAPI</text><rect x="820" y="290" width="240" height="70" rx="10" fill="#fff" stroke="#3730A3" stroke-width="1.6"/>
