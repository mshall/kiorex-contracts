<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" role="img" aria-label="kiorex-contracts at the centre" font-family="Jost, 'Segoe UI', Helvetica, Arial, sans-serif">
