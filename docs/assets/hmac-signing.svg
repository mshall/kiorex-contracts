<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-label="HMAC request and webhook signing" font-family="Jost, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>HMAC request and webhook signing</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3730A3"/><stop offset="1" stop-color="#0369A1"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3730A3"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E8735E"/></marker></defs>
<rect width="1100" height="300" rx="18" fill="#F4F6FC"/>
<rect x="0" y="0" width="1100" height="6" rx="3" fill="url(#g)"/><text x="32" y="46" font-size="22" font-weight="600" fill="#1E1B4B">Signing at a glance</text><text x="32" y="68" font-size="13" fill="#475569">Both directions use HMAC-SHA256 over a timestamp and the raw body. Verify the raw bytes, then de-duplicate on eventId.</text><rect x="40" y="100" width="300" height="80" rx="10" fill="#fff" stroke="#3730A3" stroke-width="1.6"/>
<text x="190" y="137" text-anchor="middle" font-size="15" font-weight="600" fill="#1E1B4B">Kiorex  ->  Kiorly</text><text x="190" y="155" text-anchor="middle" font-size="11" fill="#475569">signKiorlyRequest({ clientKey, clientSecret, method, path, body })</text><rect x="40" y="200" width="300" height="70" rx="10" fill="#FFF1EE" stroke="#E8735E" stroke-width="1.6"/>
<text x="190" y="232" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Kiorly  ->  Kiorex</text><text x="190" y="250" text-anchor="middle" font-size="11" fill="#475569">signWebhook / verifyWebhook (X-Kiorly-Signature)</text><path d="M340 140L420 140" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M340 235L420 235" stroke="#E8735E" stroke-width="1.8" fill="none" marker-end="url(#c)"/><rect x="420" y="100" width="320" height="80" rx="10" fill="#fff" stroke="#3730A3" stroke-width="1.6"/>
<text x="580" y="137" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">canonical string</text><text x="580" y="155" text-anchor="middle" font-size="11" fill="#475569">timestamp + method + path + body hash</text><rect x="420" y="200" width="320" height="70" rx="10" fill="#fff" stroke="#E8735E" stroke-width="1.6"/>
<text x="580" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">sha256= HMAC("${ts}.${rawBody}")</text><path d="M740 140L820 140" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M740 235L820 235" stroke="#E8735E" stroke-width="1.8" fill="none" marker-end="url(#c)"/><rect x="820" y="100" width="240" height="80" rx="10" fill="#EEF2FF" stroke="#3730A3" stroke-width="1.6"/>
<text x="940" y="137" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Receiver verifies</text><text x="940" y="155" text-anchor="middle" font-size="11" fill="#475569">5 min skew window, constant-time compare</text><rect x="820" y="200" width="240" height="70" rx="10" fill="#EEF2FF" stroke="#3730A3" stroke-width="1.6"/>
<text x="940" y="232" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Dedupe on eventId</text><text x="940" y="250" text-anchor="middle" font-size="11" fill="#475569">unknown type: log + 2xx</text>
</svg>
